<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colossal.lol - Coming Soon</title>

    <style>
        @font-face {
            font-family: 'Product Sans';
            src: local('Product Sans'), local('Google Sans');
            font-style: normal;
            font-weight: 400;
        }

        @font-face {
            font-family: 'Product Sans';
            src: local('Product Sans Bold'), local('Google Sans Bold');
            font-style: normal;
            font-weight: 700;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #E69CFF;
            --bg-dark: #0a0a0f;
            --text-primary: #ffffff;
        }

        body {
            font-family: 'Product Sans', 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .bg-gradient {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(230, 156, 255, 0.28) 0%, transparent 48%),
                radial-gradient(ellipse at 80% 80%, rgba(197, 123, 222, 0.22) 0%, transparent 48%),
                radial-gradient(ellipse at 75% 15%, rgba(180, 80, 240, 0.18) 0%, transparent 40%),
                radial-gradient(ellipse at 10% 75%, rgba(210, 100, 255, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(230, 156, 255, 0.08) 0%, transparent 65%),
                var(--bg-dark);
            z-index: -2;
        }

        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-orbs::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230, 156, 255, 0.12) 0%, transparent 70%);
            top: -10%;
            left: -10%;
            animation: orbDrift1 22s linear infinite;
            animation-delay: -7s;
            filter: blur(40px);
        }

        .bg-orbs::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(180, 80, 240, 0.14) 0%, transparent 70%);
            bottom: -10%;
            right: -5%;
            animation: orbDrift2 28s linear infinite;
            animation-delay: -10s;
            filter: blur(50px);
        }

        @keyframes orbDrift1 {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(80px, 40px) scale(1.1); }
            50% { transform: translate(120px, 80px) scale(1.2); }
            75% { transform: translate(40px, 100px) scale(1.05); }
            100% { transform: translate(0, 0) scale(1); }
        }

        @keyframes orbDrift2 {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(-60px, -30px) scale(1.08); }
            50% { transform: translate(-100px, -60px) scale(1.15); }
            75% { transform: translate(-50px, -80px) scale(1.05); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .ghosts-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .ghost {
            position: absolute;
            width: 92px;
            height: 92px;
            opacity: 0.12;
            --scale: 1;
            --dx: 0px;
            --dy: 0px;
            animation: float 42s linear infinite;
            will-change: transform;
            transform: translate3d(0, 0, 0) scale(var(--scale)) rotate(-3deg);
        }

        .ghost img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: saturate(165%) brightness(1.2)
                drop-shadow(0 0 12px rgba(230, 156, 255, 0.35));
        }

        .ghost:nth-child(1) {
            left: 5%;
            top: 10%;
            animation-delay: -1s;
            --scale: 1;
            --dx: 28px;
            --dy: -20px;
        }

        .ghost:nth-child(2) {
            left: 15%;
            top: 60%;
            animation-delay: -3s;
            --scale: 1.1;
            --dx: -36px;
            --dy: 22px;
        }

        .ghost:nth-child(3) {
            left: 25%;
            top: 30%;
            animation-delay: -5s;
            --scale: 0.9;
            --dx: 24px;
            --dy: 28px;
        }

        .ghost:nth-child(4) {
            left: 35%;
            top: 80%;
            animation-delay: -7s;
            --scale: 1.05;
            --dx: -30px;
            --dy: -18px;
        }

        .ghost:nth-child(5) {
            left: 45%;
            top: 15%;
            animation-delay: -9s;
            --scale: 1.2;
            --dx: 34px;
            --dy: 16px;
        }

        .ghost:nth-child(6) {
            left: 55%;
            top: 70%;
            animation-delay: -11s;
            --scale: 0.8;
            --dx: -26px;
            --dy: -24px;
        }

        .ghost:nth-child(7) {
            left: 65%;
            top: 40%;
            animation-delay: -13s;
            --scale: 1;
            --dx: 22px;
            --dy: 26px;
        }

        .ghost:nth-child(8) {
            left: 75%;
            top: 85%;
            animation-delay: -15s;
            --scale: 0.9;
            --dx: -32px;
            --dy: 20px;
        }

        .ghost:nth-child(9) {
            left: 85%;
            top: 20%;
            animation-delay: -17s;
            --scale: 1.3;
            --dx: 30px;
            --dy: -22px;
        }

        .ghost:nth-child(10) {
            left: 95%;
            top: 55%;
            animation-delay: -19s;
            --scale: 0.7;
            --dx: -24px;
            --dy: 24px;
        }

        @keyframes float {
            0% {
                transform: translate3d(0, 0, 0) scale(var(--scale)) rotate(-3deg);
            }
            25% {
                transform: translate3d(var(--dx), calc(var(--dy) * -0.45), 0)
                    scale(var(--scale)) rotate(2deg);
            }
            50% {
                transform: translate3d(calc(var(--dx) * -0.65), var(--dy), 0)
                    scale(var(--scale)) rotate(3deg);
            }
            75% {
                transform: translate3d(calc(var(--dx) * 0.5), calc(var(--dy) * 0.55), 0)
                    scale(var(--scale)) rotate(-2deg);
            }
            100% {
                transform: translate3d(0, 0, 0) scale(var(--scale)) rotate(-3deg);
            }
        }

        .page-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5rem 2rem;
        }

        .meow-card {
            position: relative;
            background: rgba(18, 18, 28, 0.42);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3.8rem;
            width: 100%;
            max-width: 720px;
            text-align: center;
            box-shadow:
                0 10px 26px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px) saturate(125%);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .meow-card:hover {
            border-color: rgba(230, 156, 255, 0.44);
            box-shadow:
                0 16px 34px rgba(0, 0, 0, 0.34),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .meow-logo {
            font-size: 1.95rem;
            font-weight: 800;
            margin-bottom: 2rem;
        }

        .meow-logo span {
            color: var(--primary);
        }

        .coming-title {
            font-size: 2.4rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 2rem;
            text-shadow: 0 0 24px rgba(230, 156, 255, 0.28);
        }

        .btn {
            padding: 0.9rem 2rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #E69CFF 0%, #D58DF2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(230, 156, 255, 0.3);
        }

        @media (max-width: 768px) {
            .meow-card {
                padding: 2rem 1.5rem;
            }

            .coming-title {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>
    <div class="bg-orbs"></div>

    <div class="ghosts-container">
        <div class="ghost"><img src="favicon.png" alt=""></div>
        <div class="ghost"><img src="favicon.png" alt=""></div>
        <div class="ghost"><img src="favicon.png" alt=""></div>
        <div class="ghost"><img src="favicon.png" alt=""></div>
        <div class="ghost"><img src="favicon.png" alt=""></div>
        <div class="ghost"><img src="favicon.png" alt=""></div>
        <div class="ghost"><img src="favicon.png" alt=""></div>
        <div class="ghost"><img src="favicon.png" alt=""></div>
        <div class="ghost"><img src="favicon.png" alt=""></div>
        <div class="ghost"><img src="favicon.png" alt=""></div>
    </div>

    <div class="page-content">
        <div class="meow-card">
            <div class="meow-logo">
                Colossal<span>.lol</span><br>coming soon
            </div>

            <a
                href="https://discord.gg/JmX66dGjEC"
                class="btn btn-primary"
                target="_blank"
            >
                Join The Discord
            </a>
        </div>
    </div>
</body>
</html>
